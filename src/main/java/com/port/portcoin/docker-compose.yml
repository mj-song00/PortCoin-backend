version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: portcoin_postgres
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB: coin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: portcoin_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
